# ============================================
# Alembic Configuration for DeepTutor
# ============================================
# Used to manage database schema migrations across SQLite (single-user)
# and PostgreSQL (school/district) deployments.
#
# Usage:
#   alembic current                 # Show current schema version
#   alembic upgrade head            # Apply all pending migrations
#   alembic downgrade -1            # Roll back the last migration
#   alembic history                 # Show migration history
#   alembic revision -m "..."       # Create a new migration
#
# The database URL is resolved dynamically from the DEEPTUTOR_DATABASE_URL
# environment variable (see deeptutor/db/migrations/env.py). If unset, it
# falls back to the SQLite file at data/user/chat_history.db.
# ============================================

[alembic]
# Path to migration scripts
script_location = deeptutor/db/migrations

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Version path separator
version_path_separator = os

# Output encoding
output_encoding = utf-8

# The URL is injected at runtime via env.py — do NOT put credentials here.
sqlalchemy.url =


# ============================================
# Logging configuration
# ============================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
